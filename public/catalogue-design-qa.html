<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Catalogue responsive preview</title><style>body{margin:0;background:#030711;color:#dce9e3;font:14px system-ui}nav{display:flex;gap:10px;padding:12px;position:sticky;top:0;background:#152330}button{padding:10px 18px;border:1px solid #688775;background:#213c31;color:#def3e6;border-radius:6px;cursor:pointer}iframe{display:block;width:390px;height:740px;border:1px solid #526473;margin:18px auto}p{text-align:center}</style><nav><button data-width="390">Phone 390</button><button data-width="360">Small phone 360</button><button data-width="768">Tablet 768</button><button data-width="1280">Desktop 1280</button></nav><p id="size">390px preview</p><iframe id="preview" title="Certification catalogue preview" src="/certifications/explore"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.getElementById('preview').style.width=b.dataset.width+'px';document.getElementById('size').textContent=b.dataset.width+'px preview';});</script></html>
